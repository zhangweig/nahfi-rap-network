<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0908"/>
      <stop offset="0.55" stop-color="#080606"/>
      <stop offset="1" stop-color="#140b07"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2c12"/>
      <stop offset="0.5" stop-color="#e4572e"/>
      <stop offset="1" stop-color="#a33a19"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d240b"/>
      <stop offset="0.45" stop-color="#e4572e"/>
      <stop offset="0.8" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#ff9d55"/>
    </linearGradient>
    <radialGradient id="bottomGlow" cx="0.5" cy="1" r="0.9">
      <stop offset="0" stop-color="#3a1104" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3a1104" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.09"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="round">
      <rect x="18" y="18" width="476" height="476" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="18" y="18" width="476" height="476" fill="url(#bg)"/>
    <rect x="18" y="18" width="476" height="476" fill="url(#bottomGlow)"/>

    <g filter="url(#softGlow)" opacity="0.85" fill="none" stroke="url(#flow)" stroke-width="40" stroke-linecap="round">
      <path d="M 30 312 C 160 312 202 312 252 252 C 302 192 322 177 402 177 L 476 177"/>
      <path d="M 30 366 C 170 366 216 366 266 300 C 316 234 342 223 412 223 L 476 223"/>
    </g>
    <g fill="none" stroke="url(#flow)" stroke-width="30" stroke-linecap="round">
      <path d="M 30 312 C 160 312 202 312 252 252 C 302 192 322 177 402 177 L 476 177"/>
      <path d="M 30 366 C 170 366 216 366 266 300 C 316 234 342 223 412 223 L 476 223"/>
    </g>

    <circle cx="446" cy="190" r="24" fill="url(#flow)" filter="url(#softGlow)" opacity="0.9"/>
    <circle cx="446" cy="190" r="17" fill="#ff8a45"/>

    <rect x="18" y="18" width="476" height="476" filter="url(#grain)" opacity="0.5"/>
  </g>

  <rect x="19" y="19" width="474" height="474" rx="111" fill="none" stroke="url(#edge)" stroke-width="3" filter="url(#edgeGlow)"/>
</svg>
